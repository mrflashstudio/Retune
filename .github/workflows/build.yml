name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ResonancePatcher-windows-x64
          path: build/Release/bcrypt.dll
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ResonancePatcher-windows-x64
          path: release

      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != "true" ]; then
              echo "Release already published; refusing to replace its asset."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/bcrypt.dll --clobber
          else
            gh release create "$RELEASE_TAG" release/bcrypt.dll \
              --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
